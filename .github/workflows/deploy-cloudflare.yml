name: Deploy cyhc-mail to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyhc-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      WORKER_NAME: ${{ secrets.WORKER_NAME }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      MAIL_DOMAINS: ${{ secrets.MAIL_DOMAINS }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JWT_SECRET
            WORKER_NAME CUSTOM_DOMAIN MAIL_DOMAINS ADMIN_EMAIL
            D1_DATABASE_NAME D1_DATABASE_ID KV_NAMESPACE_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || {
            echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal ID." >&2
            exit 1
          }
          [[ "$WORKER_NAME" =~ ^[a-z0-9-]+$ ]] || {
            echo "WORKER_NAME contains unsupported characters." >&2
            exit 1
          }
          [[ "$CUSTOM_DOMAIN" =~ ^([a-z0-9-]+\.)+[a-z]{2,}$ ]] || {
            echo "CUSTOM_DOMAIN must be a hostname." >&2
            exit 1
          }
          [[ "$ADMIN_EMAIL" =~ ^[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$ ]] || {
            echo "ADMIN_EMAIL must be an email address." >&2
            exit 1
          }
          [[ "$D1_DATABASE_NAME" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "D1_DATABASE_NAME contains unsupported characters." >&2
            exit 1
          }
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]] || {
            echo "D1_DATABASE_ID must be a UUID." >&2
            exit 1
          }
          [[ "$KV_NAMESPACE_ID" =~ ^[0-9a-f]{32}$ ]] || {
            echo "KV_NAMESPACE_ID must be a 32-character hexadecimal ID." >&2
            exit 1
          }
          if ! jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "string" and test("^([a-z0-9-]+\\.)+[a-z]{2,}$"))
          ' <<<"$MAIL_DOMAINS" >/dev/null; then
            echo "MAIL_DOMAINS must be a non-empty JSON array of hostnames." >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Prepare deployment configuration
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s|\${WORKER_NAME}|${WORKER_NAME}|g" wrangler-action.toml
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" wrangler-action.toml
          sed -i "s|\${D1_DATABASE_NAME}|${D1_DATABASE_NAME}|g" wrangler-action.toml
          sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" wrangler-action.toml
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" wrangler-action.toml
          sed -i "s|\"\${MAIL_DOMAINS}\"|${MAIL_DOMAINS}|g" wrangler-action.toml
          sed -i "s|\${ADMIN_EMAIL}|${ADMIN_EMAIL}|g" wrangler-action.toml

      - name: Validate deployment
        working-directory: mail-worker
        run: pnpm wrangler deploy --dry-run --config wrangler-action.toml

      - name: Deploy Worker
        working-directory: mail-worker
        run: pnpm wrangler deploy --keep-vars --config wrangler-action.toml

      - name: Store JWT as an encrypted Worker secret
        working-directory: mail-worker
        shell: bash
        run: printf '%s' "$JWT_SECRET" | pnpm wrangler secret put jwt_secret --config wrangler-action.toml

      - name: Verify deployment
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://${CUSTOM_DOMAIN}/" >/dev/null
